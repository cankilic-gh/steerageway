name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-smoke:
    name: Browser smoke (one @ci-smoke test, bundled Chromium, software WebGL)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CI=true selects the bundled Chromium project with SwiftShader software WebGL 2 (playwright.config.ts).
      # e2e:ci runs only the single @ci-smoke test (tests/e2e/ci-smoke.spec.ts): production build boot, WebGL 2
      # canvas and title, start Free Cruise, quiet HUD with no mission structure. The full browser suite needs
      # a GPU (CPU WebGL on hosted runners exceeds per-test budgets) and runs locally on Chrome and WebKit.
      - run: npm run e2e:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
